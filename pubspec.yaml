name: e_straznik
description: "e-Strażnik — natywna aplikacja mobilna (kompanion read-only do web SaaS monitorującego liczniki Tauron eLicznik)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Charts
  fl_chart: ^0.69.2

  # Secure storage / cache
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Fonts
  google_fonts: ^6.2.1

  # i18n & formatting
  intl: ^0.20.2

  # Connectivity
  connectivity_plus: ^6.1.0

  # Firebase / push
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.2.0
  flutter_local_notifications: ^18.0.1

  # Deep links
  app_links: ^6.3.2

  # Pull-to-refresh z customowym widgetem (maskotka zamiast spinnera)
  custom_refresh_indicator: ^4.0.1

  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generuje natywne splash screeny (iOS LaunchScreen + Android 12 splash)
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Konfiguracja natywnego splasha — uruchom:
#   dart run flutter_native_splash:create
# po każdej zmianie tej sekcji lub maskotki.
flutter_native_splash:
  color: "#1B2A4E"
  image: assets/images/mascot.png
  android_12:
    color: "#1B2A4E"
    image: assets/images/mascot.png
    icon_background_color: "#1B2A4E"
  ios: true
  android: true
  web: false
  fullscreen: false
